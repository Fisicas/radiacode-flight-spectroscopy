id: manual_primary_quadratic_2026-08-21
status: working_not_final
model: quadratic_channel_to_energy
channel_index_origin: zero_based_xml_channel
energy_unit: keV
coefficients:
  c0: 5.151420584
  c1: 2.431018093
  c2: 0.000374694301
output_channel_range: [0, 1023]
anchor_supported_channel_range: [22.2129571584, 937.8096002119]
extrapolated_channel_ranges:
  - [0, 22.2129571584]
  - [937.8096002119, 1023]
source_files:
  - source_spectra/Am-241.xml
  - source_spectra/Ra-226.xml
  - source_spectra/Th-232.xml
  - source_spectra/U-238-U-235-FiestaWare.xml
peak_table: manual_primary_peaks.csv
energy_converted_outputs:
  - energy_converted_spectra/Am-241_energy_calibrated.csv
  - energy_converted_spectra/Ra-226_energy_calibrated.csv
  - energy_converted_spectra/Th-232_energy_calibrated.csv
  - energy_converted_spectra/U-238-U-235-FiestaWare_energy_calibrated.csv
centroid_validation:
  script: validate_peak_centroids.py
  notebook: ../notebooks/calibration_peak_validation.ipynb
  method: poisson_bootstrap_and_leave_one_peak_out_quadratic_refits
  outputs:
    - validation/anchor_centroid_uncertainties.csv
    - validation/held_out_peak_validation.csv
    - validation/flight_feature_centroid_diagnostics.csv
    - validation/peak_validation_summary.json
  limitations: >-
    Counting-statistical centroid uncertainty does not include source,
    background-window, line-blending, detector-response, drift, or calibration-
    model systematics. No precision centroid is assigned below the lowest
    59.5-keV anchor.
fit_summary:
  selected_primary_anchor_count: 9
  rms_residual_keV: 1.24
  maximum_absolute_residual_keV: 2.57
  fit_date: '2026-08-21'
provenance:
  method: manual_primary_fit_from_calibration_source_spectra
  source_materials:
    - Am-241
    - radium_series
    - thorium_series
    - uranium_bearing_ceramic
  notes: >-
    The calibration is an energy-channel conversion for spectral comparison.
    It is not a dose calibration. The high-energy quadratic term remains
    sensitive to the fitted Tl-208 2614.5 keV centroid and should be confirmed
    with a longer acquisition or an independent reference before final release.
